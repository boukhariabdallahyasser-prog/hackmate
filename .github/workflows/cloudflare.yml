name: HackMate build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, design/hackmate-experience-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackmate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://hackmate.yazerabdo01.workers.dev
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://fqydthbluwwczwaytifz.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_53uEU-SMwek644dG-1UiXg_YB3Sq94r' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:vinext
      - name: Verify deployed Worker runtime can reach Supabase
        run: |
          set -euo pipefail
          npm run start:vinext -- --host 127.0.0.1 --port 3197 > "$RUNNER_TEMP/hackmate-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 35); do
            status=$(curl -s -o "$RUNNER_TEMP/health.json" -w "%{http_code}" --max-time 6 "http://127.0.0.1:3197/api/health" || true)
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error title=Cloudflare runtime disconnected::The Worker was built but cannot reach Supabase."
            tail -n 120 "$RUNNER_TEMP/hackmate-worker.log" || true
            test ! -f "$RUNNER_TEMP/health.json" || cat "$RUNNER_TEMP/health.json"
            exit 1
          fi
          node -e 'const fs=require("node:fs");const result=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/health.json","utf8"));if(result.status!=="ready"||result.registrationEligibility!=="reachable"){process.exit(1)}}'
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0962383a4987a9f1fc70aa47c19d8575' }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf -v missing_list '%s, ' "${missing[@]}"
            echo "::error title=Deployment blocked::Missing GitHub Actions settings: ${missing_list%, }"
            {
              echo "### Cloudflare deployment blocked"
              echo "The build succeeded, but the production Worker was not deployed."
              echo "Missing settings: \`${missing_list%, }\`"
              echo "Configure these values under the GitHub repository's Actions secrets and variables."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npx --no-install cf deploy --prebuilt --mode production
